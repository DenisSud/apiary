<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi bots</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/blobatar-motion.css">
<link rel="stylesheet" href="/blobatar-gaze.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>bots <button id="refresh" title="refresh">&#8635;</button></h1>
    <ul id="bot-list"></ul>
  </aside>
  <main id="main">
    <header id="session-bar">
      <span id="session-title">no session</span>
      <span id="session-status"></span>
      <span id="session-actions">
        <button id="stop" title="abort the running turn" disabled>stop</button>
        <button id="compact" title="compact the session history" disabled>compact</button>
        <button id="new" title="start a new session" disabled>new</button>
      </span>
    </header>
    <section id="transcript"></section>
    <button id="latest" hidden title="jump to the latest">&#8595; latest</button>
    <form id="prompt-form">
      <textarea id="prompt" rows="3" placeholder="prompt (enter sends, shift+enter newline)"></textarea>
      <button id="send" type="submit" title="send">&#8593;</button>
    </form>
  </main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
