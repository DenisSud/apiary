# Radicale (CalDAV) for the personal calendar — RPi, rootless podman.
#
# Deployed with:  podman-compose --in-pod false up -d
#
# --in-pod false is required: `userns_mode: keep-id` cannot be combined with a
# pod, and keep-id (plus `user: 1000:1000`) is what keeps ./data owned by denis
# on the host instead of a subuid — which keeps host-side backups a plain tar.
#
# restart: always, not unless-stopped: this RPi's podman-restart.service only
# resurrects restart-policy=always containers at boot (the unless-stopped
# sovenook container proves it — it did not come back after the July reboot).
services:
  radicale:
    image: docker.io/tomsquest/docker-radicale:3.8.0.0
    container_name: radicale
    restart: always
    userns_mode: keep-id
    user: "1000:1000"
    environment:
      TAKE_FILE_OWNERSHIP: "false"
    ports:
      - "127.0.0.1:5232:5232"
    volumes:
      - ./data:/data
      - ./config:/config:ro
